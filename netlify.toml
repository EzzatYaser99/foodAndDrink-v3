# Netlify build config for foodAndDrink-v3 (frontend in "front" subfolder)
# Use repo-relative paths only. Do not use URLs or absolute paths.

[build]
  base = "front"
  command = "npm run build"
  publish = "dist/front/browser"

# Use Node 20 so the build runs consistently
[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA: serve index.html for all routes (Netlify serves real files first, then this)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Leave Package directory and Functions directory blank in Netlify UI
# unless you have a specific monorepo/functions setup.
