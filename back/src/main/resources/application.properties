spring.application.name=back
server.port=6060
spring.datasource.url=jdbc:postgresql://localhost:5433/foodAndDrink
spring.datasource.username=postgres
spring.datasource.password=123456As
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
#Configure Flyway
spring.flyway.url=jdbc:postgresql://localhost:5433/foodAndDrink
spring.flyway.enabled=true
logging.level.org.flywaydb=DEBUG
spring.flyway.user=postgres
spring.flyway.password=123456As
spring.flyway.locations=classpath:db/migration
spring.flyway.baselineOnMigrate=true
logging.level.org.flywaydb.core=TRACE
#if need to run scripts automatically
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
