<div class="social-media">
  @for (item of socialMediaInfo; track item) {
    <a
      [href]="item.href"
      [pTooltip]="this.lang == 'en' ? item.titleEN : item.titleAR"
      [tooltipPosition]="'bottom'"
      target="_blank"
      class="social-link"
    >
      <div class="content" [class]="item.class">
        <i class="{{ item.icon }}"></i>
      </div>
    </a>
  }
</div>
