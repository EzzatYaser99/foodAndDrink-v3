<div [pTooltip]="'common.change_to_language' | translate" tooltipPosition="bottom"  class="lang"
     (click)="toggleLang()" (keydown)="toggleLang()">
  <span [class.bolder-text]="currentLang == 'en'">{{ toggleText | uppercase | translate }}</span>
  <span><i class="fa-solid fa-globe"></i></span>
</div>

@if (isLoading) {
  <app-spinner></app-spinner>
}
