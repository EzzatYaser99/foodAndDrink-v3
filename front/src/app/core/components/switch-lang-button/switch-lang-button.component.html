<div  class="lang theme-{{ theme }}"
  (click)="toggleLang()" (keydown)="toggleLang()">
  <span>{{ toggleText | uppercase | translate }}</span>
  <span class="mx-1"><i class="fa-solid fa-globe"></i></span>
</div>

<div  class="spinner-overlay">
  <div class="spinner"></div>
</div>
}
